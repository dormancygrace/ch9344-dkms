name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install generic kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic
      - name: Build kernel module
        run: |
          header_dir=$(find /usr/src -maxdepth 1 -type d \
            -name 'linux-headers-*-generic' -print | sort -V | tail -n 1)
          test -n "$header_dir"
          kernel_release=${header_dir##*/linux-headers-}
          make -C driver KERNELRELEASE="$kernel_release" W=1 KCFLAGS=-Werror
      - name: Check shell scripts
        run: |
          shellcheck scripts/build-deb.sh packaging/postinst packaging/prerm packaging/postrm
          sh -n scripts/build-deb.sh packaging/postinst packaging/prerm packaging/postrm
      - name: Build Debian package
        run: ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ch9344-dkms-deb
          path: dist/*.deb
